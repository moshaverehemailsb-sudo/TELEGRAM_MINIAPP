<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>تحلیل آزمون کنکور</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #f1f5f9;
            --card: #ffffff;
            --ink: #0f172a;
            --muted: #64748b;
            --line: #e2e8f0;
            --soft: #f8fafc;
            --brand: #4f46e5;
            --brand2: #7c3aed;
            --ok: #16a34a;
            --okbg: #dcfce7;
            --bad: #dc2626;
            --badbg: #fee2e2;
            --blank: #475569;
            --blankbg: #e2e8f0;
            --warn: #d97706;
            --warnbg: #fef3c7;
            --warntext: #92400e;
            --radius: 18px;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
        }

        body {
            background: var(--bg);
            color: var(--ink);
            font-family: 'Vazirmatn', Tahoma, sans-serif;
            padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px));
            -webkit-font-smoothing: antialiased;
        }

        /* ---------- Hero ---------- */
        .hero {
            position: relative;
            overflow: hidden;
            color: #fff;
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 55%, #a855f7 100%);
            padding: calc(22px + env(safe-area-inset-top, 0px)) 18px 62px;
            border-radius: 0 0 30px 30px;
        }

        .hero::before,
        .hero::after {
            content: "";
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, .1);
        }

        .hero::before {
            width: 240px;
            height: 240px;
            top: -110px;
            left: -70px;
        }

        .hero::after {
            width: 150px;
            height: 150px;
            bottom: -70px;
            right: -30px;
        }

        .hero-row {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            flex: none;
            width: 52px;
            height: 52px;
            border-radius: 16px;
            background: rgba(255, 255, 255, .22);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 800;
        }

        .hero h1 {
            margin: 0;
            font-size: 18px;
            font-weight: 800;
        }

        .hero .sub {
            margin-top: 3px;
            font-size: 13px;
            opacity: .92;
        }

        /* ---------- Layout ---------- */
        .wrap {
            max-width: 720px;
            margin: -40px auto 0;
            padding: 0 14px;
            position: relative;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            padding: 16px;
            margin-bottom: 14px;
            box-shadow: 0 6px 18px rgba(15, 23, 42, .06);
        }

        .card-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            font-size: 15px;
            font-weight: 700;
            margin: 0 0 12px;
        }

        .card-title small {
            font-size: 12px;
            color: var(--muted);
            font-weight: 500;
        }

        .link {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: inherit;
        }

        .arrow {
            color: var(--muted);
            font-size: 20px;
            flex: none;
        }

        .meta {
            font-size: 12px;
            color: var(--muted);
            margin-top: 3px;
        }

        /* ---------- Advisor card ---------- */
        .advisor-card {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .advisor-icon {
            flex: none;
            width: 46px;
            height: 46px;
            border-radius: 14px;
            background: linear-gradient(135deg, #eef2ff, #ede9fe);
            color: var(--brand);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .advisor-main {
            flex: 1;
            min-width: 0;
        }

        .advisor-main b {
            font-size: 15px;
        }

        /* ---------- Buttons and forms ---------- */
        .cta {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
            color: #fff;
            font-weight: 800;
            font-size: 15px;
            padding: 14px;
            border-radius: 16px;
            margin-bottom: 14px;
            border: none;
            width: 100%;
            font-family: inherit;
            cursor: pointer;
            background: linear-gradient(135deg, var(--brand), var(--brand2));
            box-shadow: 0 10px 22px rgba(79, 70, 229, .28);
        }

        .cta[disabled] {
            opacity: .5;
            cursor: not-allowed;
        }

        .btn {
            font-family: inherit;
            font-size: 14px;
            font-weight: 700;
            padding: 9px 16px;
            border-radius: 12px;
            border: 1px solid #cbd5e1;
            background: #fff;
            color: var(--ink);
            text-decoration: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
        }

        .btn.primary {
            background: linear-gradient(135deg, var(--brand), var(--brand2));
            color: #fff;
            border-color: transparent;
        }

        .btn.danger {
            color: var(--bad);
            border-color: #fecaca;
        }

        .btn[disabled] {
            opacity: .5;
            cursor: not-allowed;
        }

        .action-bar {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            margin: 0 0 12px;
            flex-wrap: wrap;
        }

        .input {
            font-family: inherit;
            font-size: 16px;
            color: var(--ink);
            width: 100%;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            background: var(--soft);
            padding: 12px 14px;
            outline: none;
            direction: ltr;
            text-align: center;
            letter-spacing: 2px;
        }

        .input:focus {
            border-color: var(--brand);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(79, 70, 229, .12);
        }

        .hint {
            font-size: 12px;
            color: var(--muted);
            margin-top: 8px;
            line-height: 1.8;
        }

        /* ---------- Stats ---------- */
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 14px;
        }

        .stat {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 12px;
            box-shadow: 0 4px 12px rgba(15, 23, 42, .05);
        }

        .stat .label {
            font-size: 11px;
            color: var(--muted);
            font-weight: 600;
        }

        .stat .value {
            font-size: 19px;
            font-weight: 800;
            margin-top: 4px;
        }

        .delta {
            font-size: 11px;
            font-weight: 700;
            margin-top: 4px;
        }

        .up {
            color: var(--ok);
        }

        .down {
            color: var(--bad);
        }

        .flat {
            color: var(--muted);
        }

        @media (max-width: 420px) {
            .stat .value {
                font-size: 16px;
            }
        }

        /* ---------- Chips and bars ---------- */
        .chips {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .chip {
            font-size: 12px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 999px;
        }

        .c-ok {
            background: var(--okbg);
            color: var(--ok);
        }

        .c-bad {
            background: var(--badbg);
            color: var(--bad);
        }

        .c-blank {
            background: var(--blankbg);
            color: var(--blank);
        }

        .c-rank {
            background: #eef2ff;
            color: #3730a3;
        }

        .bar {
            display: flex;
            height: 8px;
            border-radius: 999px;
            overflow: hidden;
            background: var(--line);
            margin-top: 10px;
        }

        .bar span {
            display: block;
            height: 100%;
        }

        .b-ok {
            background: var(--ok);
        }

        .b-bad {
            background: var(--bad);
        }

        .b-blank {
            background: #94a3b8;
        }

        /* ---------- Exam list ---------- */
        .exam-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px;
            text-decoration: none;
            color: inherit;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 16px;
            margin-bottom: 10px;
            box-shadow: 0 4px 12px rgba(15, 23, 42, .04);
            transition: transform .15s;
        }

        .exam-row:active {
            transform: scale(.985);
        }

        .exam-index {
            flex: none;
            width: 46px;
            height: 46px;
            border-radius: 14px;
            background: linear-gradient(135deg, #eef2ff, #ede9fe);
            color: var(--brand);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 16px;
        }

        .exam-main {
            flex: 1;
            min-width: 0;
        }

        .exam-main b {
            display: block;
            font-size: 15px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ---------- Subjects ---------- */
        .subj-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid var(--line);
        }

        .subj-row:last-child {
            border-bottom: none;
        }

        .subj-row>div:first-child {
            flex: 1;
            min-width: 0;
        }

        .subj-name {
            font-weight: 700;
            font-size: 14px;
        }

        .subj-rank {
            font-size: 12px;
            font-weight: 700;
            color: #3730a3;
            background: #eef2ff;
            padding: 5px 10px;
            border-radius: 999px;
            white-space: nowrap;
        }

        /* ---------- Reasons ---------- */
        .weak-item {
            margin-bottom: 12px;
        }

        .weak-head {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .weak-track {
            height: 8px;
            background: var(--line);
            border-radius: 999px;
            overflow: hidden;
        }

        .weak-fill {
            height: 100%;
            border-radius: 999px;
        }

        .reason-group {
            margin-top: 12px;
        }

        .reason-group h4 {
            margin: 0 0 6px;
            font-size: 12px;
            color: var(--muted);
            font-weight: 700;
        }

        .refs {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .ref {
            background: var(--soft);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 4px 9px;
            font-size: 12px;
        }

        /* ---------- Notes ---------- */
        .note {
            background: var(--soft);
            border-radius: 12px;
            padding: 10px 12px;
            margin-bottom: 8px;
            font-size: 13px;
            line-height: 1.9;
            border-inline-start: 4px solid;
        }

        .note b {
            display: block;
            font-size: 12px;
            color: var(--muted);
            margin-bottom: 2px;
        }

        .n-scratch {
            border-color: var(--bad);
        }

        .n-practice {
            border-color: var(--warn);
        }

        .n-review {
            border-color: var(--brand);
        }

        /* ---------- Charts ---------- */
        .chart-box {
            position: relative;
            height: 240px;
        }

        /* ---------- Notices and states ---------- */
        .notice {
            border-radius: 12px;
            padding: 12px 14px;
            margin-bottom: 14px;
            font-size: 14px;
            line-height: 1.8;
        }

        .n-ok-box {
            background: var(--okbg);
            color: var(--ok);
        }

        .n-err-box {
            background: var(--badbg);
            color: var(--bad);
        }

        .empty {
            text-align: center;
            padding: 28px 12px;
            color: var(--muted);
            font-size: 14px;
            line-height: 1.9;
        }

        .empty .icon {
            font-size: 34px;
            margin-bottom: 6px;
        }

        .error {
            background: var(--badbg);
            color: var(--bad);
            font-size: 14px;
            line-height: 1.8;
        }

        .loader {
            display: flex;
            justify-content: center;
            padding: 50px 0;
        }

        .spinner {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 3px solid var(--line);
            border-top-color: var(--brand);
            animation: spin .8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .back {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin: 2px 0 12px;
            color: var(--brand);
            text-decoration: none;
            font-size: 14px;
            font-weight: 700;
        }

        /* ---------- Modal (confirm) ---------- */
        .modal-bg {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, .45);
            z-index: 20;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-bg.open {
            display: flex;
        }

        .modal {
            background: var(--card);
            border-radius: 18px;
            padding: 20px;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 20px 40px rgba(15, 23, 42, .25);
        }

        .modal h3 {
            margin: 0 0 8px;
            font-size: 16px;
        }

        .modal p {
            margin: 0 0 16px;
            font-size: 14px;
            line-height: 1.9;
            color: #334155;
        }

        .modal .actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }

        /* ---------- Bottom navigation ---------- */
        nav.bottom {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 10;
            display: flex;
            justify-content: space-around;
            gap: 6px;
            background: var(--card);
            border-top: 1px solid var(--line);
            padding: 8px 10px calc(8px + env(safe-area-inset-bottom, 0px));
            box-shadow: 0 -6px 20px rgba(15, 23, 42, .06);
        }

        nav.bottom a {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            padding: 6px 4px;
            border-radius: 14px;
            text-decoration: none;
            color: var(--muted);
            font-size: 12px;
            font-weight: 600;
        }

        nav.bottom a.active {
            color: var(--brand);
            background: #eef2ff;
        }

        footer.credit {
            text-align: center;
            color: var(--muted);
            font-size: 12px;
            margin: 26px 0 10px;
        }
    </style>
</head>

<body>

    <header class="hero">
        <div class="hero-row">
            <div class="avatar" id="avatar">؟</div>
            <div>
                <h1 id="hello">تحلیل آزمون کنکور</h1>
                <div class="sub" id="sub">در حال اتصال...</div>
            </div>
        </div>
    </header>

    <main class="wrap">
        <div id="notice"></div>
        <div id="view">
            <div class="loader">
                <div class="spinner"></div>
            </div>
        </div>
    </main>

    <footer class="credit">ساخته شده توسط سینا باقری</footer>

    <nav class="bottom">
        <a href="#/" data-nav="dashboard">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z" />
            </svg>
            داشبورد
        </a>
        <a href="#/exams" data-nav="exams">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <rect x="5" y="3" width="14" height="18" rx="2" />
                <path d="M9 8h6M9 12h6M9 16h4" />
            </svg>
            آزمون‌ها
        </a>
        <a href="#/progress" data-nav="progress">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 20V10M10 20V4M16 20v-7M22 20H2" />
            </svg>
            پیشرفت
        </a>
    </nav>

    <div class="modal-bg" id="modal">
        <div class="modal" role="dialog" aria-modal="true">
            <h3 id="modal-title"></h3>
            <p id="modal-text"></p>
            <div class="actions">
                <button class="btn" type="button" id="modal-cancel">انصراف</button>
                <button class="btn primary" type="button" id="modal-ok">تأیید</button>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram && window.Telegram.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
            applyTelegramTheme();
        }

        // Development only: open as /?dev=900000050
        const devId = new URLSearchParams(location.search).get("dev");
        const QS = location.search;

        const $ = sel => document.querySelector(sel);

        const SUBJECT_ORDER = ["math", "physics", "chemistry"];
        const SUBJECT_NAME = { math: "ریاضی", physics: "فیزیک", chemistry: "شیمی" };
        const SUBJECT_COLOR = { math: "#4f46e5", physics: "#0891b2", chemistry: "#16a34a" };

        const REASONS = {
            lucky: { label: "شانسی", group: "ok", color: "#86efac" },
            long_solution: { label: "راه حل طولانی", group: "ok", color: "#16a34a" },
            careless: { label: "بی‌دقتی", group: "bad", color: "#fca5a5" },
            knowledge_gap: { label: "مشکل علمی", group: "bad", color: "#dc2626" },
            budget: { label: "نرسیدن به بودجه‌بندی", group: "blank", color: "#cbd5e1" },
            time: { label: "کم آوردن زمان", group: "blank", color: "#94a3b8" },
            unsolved: { label: "نتوانستم حل کنم", group: "blank", color: "#475569" },
        };

        const NOTE_CLASS = { from_scratch: "n-scratch", more_practice: "n-practice", review: "n-review" };

        let charts = [];
        let registered = false;

        // ---------- Helpers ----------

        function applyTelegramTheme() {
            const t = tg.themeParams || {};
            const style = document.documentElement.style;
            if (t.bg_color) style.setProperty("--card", t.bg_color);
            if (t.secondary_bg_color) style.setProperty("--bg", t.secondary_bg_color);
            if (t.text_color) style.setProperty("--ink", t.text_color);
            if (t.hint_color) style.setProperty("--muted", t.hint_color);
            if (t.hint_color) style.setProperty("--line", t.hint_color + "33");
        }

        function esc(value) {
            return String(value ?? "").replace(/[&<>"']/g, c => (
                { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
            ));
        }

        function fmt(value) {
            return value == null || value === "" ? "—" : Number(value).toLocaleString("fa-IR");
        }

        function fmtDate(iso) {
            try { return new Date(iso).toLocaleDateString("fa-IR"); } catch (_) { return ""; }
        }

        function formLink(extra = {}) {
            const p = new URLSearchParams(location.search);
            Object.entries(extra).forEach(([k, v]) => p.set(k, v));
            const q = p.toString();
            return "exam-form.html" + (q ? "?" + q : "");
        }

        function trend(delta, higherIsBetter) {
            if (delta == null) return "";
            if (delta === 0) return `<div class="delta flat">بدون تغییر</div>`;
            const improved = higherIsBetter ? delta > 0 : delta < 0;
            const sign = delta > 0 ? "+" : "−";
            return `<div class="delta ${improved ? "up" : "down"}">${improved ? "▲" : "▼"} ${sign}${Math.abs(delta).toLocaleString("fa-IR")}</div>`;
        }

        function bar(ok, bad, blank) {
            const total = ok + bad + blank;
            if (!total) return "";
            const pct = v => ((v / total) * 100).toFixed(2);
            return `
    <div class="bar" title="صحیح ${ok} · غلط ${bad} · نزده ${blank}">
      <span class="b-ok" style="width:${pct(ok)}%"></span>
      <span class="b-bad" style="width:${pct(bad)}%"></span>
      <span class="b-blank" style="width:${pct(blank)}%"></span>
    </div>`;
        }

        function chips(totals) {
            return `
    <div class="chips">
      <span class="chip c-ok">صحیح ${fmt(totals.correct)}</span>
      <span class="chip c-bad">غلط ${fmt(totals.wrong)}</span>
      <span class="chip c-blank">نزده ${fmt(totals.blank)}</span>
    </div>`;
        }

        function emptyState(icon, title, text) {
            return `<div class="card empty"><div class="icon">${icon}</div><div><b>${esc(title)}</b></div><div>${esc(text)}</div></div>`;
        }

        function notify(text, type = "ok") {
            $("#notice").innerHTML = `<div class="notice n-${type}-box">${esc(text)}</div>`;
            window.scrollTo({ top: 0, behavior: "smooth" });
        }

        function authHeaders() {
            if (tg && tg.initData) return { "X-Telegram-Init-Data": tg.initData };
            if (devId) return { "X-Dev-Telegram-Id": devId };
            return {};
        }

        async function api(path, options = {}) {
            const headers = { ...authHeaders() };
            if (options.body) headers["Content-Type"] = "application/json; charset=utf-8";
            const res = await fetch("/api" + path, { ...options, headers });
            let body = null;
            try { body = await res.json(); } catch (_) { }
            if (!res.ok) {
                const err = new Error(
                    body && typeof body.detail === "string" ? body.detail : "ارتباط با سرور برقرار نشد."
                );
                err.status = res.status;
                throw err;
            }
            return body;
        }

        // Replaces window.confirm with an in-app dialog (works inside Telegram too)
        function confirmDialog(title, text) {
            return new Promise(resolve => {
                $("#modal-title").textContent = title;
                $("#modal-text").textContent = text;
                $("#modal").classList.add("open");
                const done = result => {
                    $("#modal").classList.remove("open");
                    $("#modal-ok").onclick = null;
                    $("#modal-cancel").onclick = null;
                    resolve(result);
                };
                $("#modal-ok").onclick = () => done(true);
                $("#modal-cancel").onclick = () => done(false);
            });
        }

        // ---------- Charts ----------

        function resetCharts() {
            charts.forEach(c => c.destroy());
            charts = [];
        }

        function lineChart(id, labels, datasets, reverse = false) {
            const el = document.getElementById(id);
            if (!el || !window.Chart) return;
            charts.push(new Chart(el, {
                type: "line",
                data: { labels, datasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: { mode: "index", intersect: false },
                    plugins: { legend: { display: datasets.length > 1, position: "bottom" } },
                    scales: {
                        y: { reverse, grid: { color: "#e2e8f0" } },
                        x: { grid: { display: false } },
                    },
                },
            }));
        }

        function singleLine(label, color, values) {
            return {
                label,
                data: values,
                borderColor: color,
                backgroundColor: color + "22",
                fill: true,
                tension: 0.35,
                spanGaps: true,
                pointRadius: 4,
            };
        }

        function stackedBars(id, labels, datasets) {
            const el = document.getElementById(id);
            if (!el || !window.Chart) return;
            charts.push(new Chart(el, {
                type: "bar",
                data: { labels, datasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { position: "bottom" } },
                    scales: {
                        x: { stacked: true, grid: { display: false } },
                        y: { stacked: true, beginAtZero: true, grid: { color: "#e2e8f0" } },
                    },
                },
            }));
        }

        function weakTopics(reasons) {
            const totals = {};
            reasons.forEach(r => {
                Object.entries(r.counts).forEach(([code, n]) => {
                    totals[code] = (totals[code] || 0) + n;
                });
            });
            const items = Object.entries(totals)
                .filter(([code, n]) => n > 0 && REASONS[code] && REASONS[code].group !== "ok")
                .sort((a, b) => b[1] - a[1])
                .slice(0, 5);
            const max = items.length ? items[0][1] : 0;
            return items.map(([code, n]) => ({
                code, label: REASONS[code].label, count: n, pct: (n / max) * 100,
                color: REASONS[code].color,
            }));
        }

        // ---------- Advisor card and linking ----------

        function advisorCardHtml(advisor) {
            if (!advisor) {
                return `
      <div class="card">
        <div class="card-title">مشاور من</div>
        <div class="advisor-card" style="margin-bottom:12px">
          <div class="advisor-icon">🧭</div>
          <div class="advisor-main">
            <b>هنوز به مشاور متصل نیستید</b>
            <div class="meta">کد دعوتی که مشاورتان داده را وارد کنید.</div>
          </div>
        </div>
        <div class="field-wrap">
          <input class="input" id="invite-input" placeholder="XXXX-XXXX" maxlength="12" autocomplete="off">
          <div class="hint">کد ۸ کاراکتری را همان‌طور که دریافت کرده‌اید وارد کنید.</div>
        </div>
        <div style="margin-top:12px">
          <button class="cta" type="button" id="redeem-btn" style="margin:0">اتصال به مشاور</button>
        </div>
      </div>`;
            }
            return `
    <div class="card">
      <div class="card-title">مشاور من <small>متصل از ${esc(fmtDate(advisor.linked_at))}</small></div>
      <div class="advisor-card">
        <div class="advisor-icon">🧑‍🏫</div>
        <div class="advisor-main">
          <b>${esc(advisor.full_name)}</b>
          <div class="meta">مشاور فقط آزمون‌هایی را می‌بیند که خودتان ثبت کرده‌اید.</div>
        </div>
      </div>
      <div class="action-bar" style="margin:12px 0 0">
        <button class="btn danger" type="button" id="unlink-btn">قطع اتصال با مشاور</button>
      </div>
    </div>`;
        }

        // ---------- Views ----------

        async function loadHero() {
            try {
                const me = await api("/me");
                registered = true;
                $("#avatar").textContent = (me.full_name || "؟").trim().charAt(0);
                $("#hello").textContent = `سلام ${me.full_name}`;
                $("#sub").textContent = `${fmt(me.exam_count)} آزمون ثبت شده`;
            } catch (err) {
                registered = false;
                $("#hello").textContent = "تحلیل آزمون کنکور";
                $("#sub").textContent = err.status === 404 ? "ثبت‌نام نشده" : err.message;
            }
        }

        async function renderDashboard() {
            const [exams, progress, reasons, advisor] = await Promise.all([
                api("/exams"), api("/progress"), api("/progress/reasons"), api("/me/advisor"),
            ]);
            const view = $("#view");

            const addBtn = `<a class="cta" href="${formLink()}">＋ ثبت آزمون جدید</a>`;

            if (!exams.length) {
                view.innerHTML = addBtn + advisorCardHtml(advisor)
                    + emptyState("📭", "هنوز آزمونی ثبت نشده است", "با دکمه بالا اولین آزمون خود را ثبت کنید.");
                return;
            }

            const last = exams[exams.length - 1];
            const prev = exams.length > 1 ? exams[exams.length - 2] : null;
            const lastPoint = progress[progress.length - 1];
            const weak = weakTopics(reasons);

            const subjectsHtml = SUBJECT_ORDER
                .filter(code => lastPoint && lastPoint.subjects[code])
                .map(code => {
                    const s = lastPoint.subjects[code];
                    return `
        <div class="subj-row">
          <div>
            <div class="subj-name">${SUBJECT_NAME[code]}</div>
            ${bar(s.correct, s.wrong, s.blank)}
          </div>
          <div class="subj-rank">رتبه ${fmt(s.rank)}</div>
        </div>`;
                }).join("");

            const weakHtml = weak.length
                ? weak.map(w => `
        <div class="weak-item">
          <div class="weak-head"><span>${esc(w.label)}</span><span>${fmt(w.count)} مورد</span></div>
          <div class="weak-track"><div class="weak-fill" style="width:${w.pct}%;background:${w.color}"></div></div>
        </div>`).join("")
                : `<div class="meta">هنوز دلیلی برای غلط یا نزده ثبت نشده است.</div>`;

            view.innerHTML = `
    ${addBtn}
    ${advisorCardHtml(advisor)}

    <div class="stats">
      <div class="stat">
        <div class="label">تراز کل</div>
        <div class="value">${fmt(last.overall_traz)}</div>
        ${prev ? trend(last.overall_traz - prev.overall_traz, true) : ""}
      </div>
      <div class="stat">
        <div class="label">رتبه کل</div>
        <div class="value">${fmt(last.overall_rank)}</div>
        ${prev ? trend(last.overall_rank - prev.overall_rank, false) : ""}
      </div>
      <div class="stat">
        <div class="label">تعداد آزمون</div>
        <div class="value">${fmt(exams.length)}</div>
        <div class="delta flat">${esc(last.held_on)}</div>
      </div>
    </div>

    <a class="card link" href="#/exams/${last.id}">
      <div style="flex:1;min-width:0">
        <div class="meta" style="margin:0 0 4px">آخرین آزمون</div>
        <div style="font-weight:800;font-size:16px">${esc(last.name)}</div>
        <div class="meta">${esc(last.held_on)} · رتبه منطقه ${fmt(last.region_rank)}</div>
        <div style="margin-top:10px">${chips(last.totals)}</div>
      </div>
      <span class="arrow">←</span>
    </a>

    <div class="card">
      <div class="card-title">عملکرد درس‌ها در آخرین آزمون</div>
      ${subjectsHtml || `<div class="meta">اطلاعات درس‌ها ثبت نشده است.</div>`}
    </div>

    <div class="card">
      <div class="card-title">روند تراز کل</div>
      <div class="chart-box"><canvas id="c-traz"></canvas></div>
    </div>

    <div class="card">
      <div class="card-title">روند رتبه کل <small>هرچه بالاتر، بهتر</small></div>
      <div class="chart-box"><canvas id="c-rank"></canvas></div>
    </div>

    <div class="card">
      <div class="card-title">بیشترین دلایل غلط و نزده <small>در همه آزمون‌ها</small></div>
      ${weakHtml}
    </div>

    <div class="card" style="text-align:center">
      <a href="#/progress" style="color:var(--brand);font-weight:700;text-decoration:none">مشاهده نمودارهای کامل پیشرفت ←</a>
    </div>`;

            lineChart("c-traz", exams.map(e => e.name), [singleLine("تراز کل", "#4f46e5", exams.map(e => e.overall_traz))]);
            lineChart("c-rank", exams.map(e => e.name), [singleLine("رتبه کل", "#7c3aed", exams.map(e => e.overall_rank))], true);
        }

        async function renderExams() {
            const exams = await api("/exams");
            const view = $("#view");

            const addBtn = `<a class="cta" href="${formLink()}">＋ ثبت آزمون جدید</a>`;

            if (!exams.length) {
                view.innerHTML = addBtn + emptyState("📭", "هنوز آزمونی ثبت نشده است", "با دکمه بالا اولین آزمون خود را ثبت کنید.");
                return;
            }

            const ordered = exams.map((e, i) => ({ e, n: i + 1 })).reverse();
            view.innerHTML = `
    ${addBtn}
    <div class="card-title" style="margin-top:4px">همه آزمون‌ها <small>جدیدترین بالا</small></div>
    ${ordered.map(({ e, n }) => `
      <a class="exam-row" href="#/exams/${e.id}">
        <div class="exam-index">${fmt(n)}</div>
        <div class="exam-main">
          <b>${esc(e.name)}</b>
          <div class="meta">${esc(e.held_on)} · تراز ${fmt(e.overall_traz)} · رتبه ${fmt(e.overall_rank)}</div>
          <div style="margin-top:8px">${chips(e.totals)}</div>
        </div>
        <span class="arrow">←</span>
      </a>`).join("")}`;
        }

        async function renderExam(id) {
            const e = await api(`/exams/${encodeURIComponent(id)}`);
            const view = $("#view");

            const subjectsHtml = e.subjects.map(s => {
                const reasonsHtml = s.reasons.length
                    ? s.reasons.map(r => `
          <div class="reason-group">
            <h4>${esc(r.label)}</h4>
            <div class="refs">${r.items.map(item => `<span class="ref">${esc(item)}</span>`).join("")}</div>
          </div>`).join("")
                    : `<div class="meta" style="margin-top:10px">دلیلی برای این درس ثبت نشده است.</div>`;

                return `
      <div class="card">
        <div class="card-title">
          <span>${esc(s.subject_name)}</span>
          <span class="chip c-rank">رتبه ${fmt(s.rank)}</span>
        </div>
        ${chips({ correct: s.correct, wrong: s.wrong, blank: s.blank })}
        ${bar(s.correct, s.wrong, s.blank)}
        ${reasonsHtml}
      </div>`;
            }).join("");

            const notesHtml = e.notes.length
                ? e.notes.map(n => `
        <div class="note ${NOTE_CLASS[n.level] || ""}">
          <b>${esc(n.label)}</b>${esc(n.text)}
        </div>`).join("")
                : `<div class="meta">یادداشتی ثبت نشده است.</div>`;

            view.innerHTML = `
    <a class="back" href="#/exams">→ بازگشت به آزمون‌ها</a>

    <div class="action-bar">
      <a class="btn" href="${formLink({ id: e.id })}">ویرایش آزمون</a>
      <button class="btn danger" type="button" id="delete-exam" data-id="${e.id}" data-name="${esc(e.name)}">حذف</button>
    </div>

    <div class="card">
      <div style="font-weight:800;font-size:17px">${esc(e.name)}</div>
      <div class="meta">${esc(e.held_on)}</div>
      <div class="stats" style="margin:14px 0 0">
        <div class="stat"><div class="label">تراز کل</div><div class="value">${fmt(e.overall_traz)}</div></div>
        <div class="stat"><div class="label">رتبه کل</div><div class="value">${fmt(e.overall_rank)}</div></div>
        <div class="stat"><div class="label">رتبه منطقه</div><div class="value">${fmt(e.region_rank)}</div></div>
      </div>
      <div style="margin-top:14px">${chips(e.totals)}</div>
      ${bar(e.totals.correct, e.totals.wrong, e.totals.blank)}
    </div>

    ${subjectsHtml}

    <div class="card">
      <div class="card-title">جمع‌بندی و راهکارها</div>
      ${notesHtml}
    </div>`;
        }

        async function renderProgress() {
            const [points, reasons] = await Promise.all([api("/progress"), api("/progress/reasons")]);
            const view = $("#view");

            if (!points.length) {
                view.innerHTML = emptyState("📈", "نمودار هنوز آماده نیست", "برای نمایش پیشرفت، حداقل یک آزمون ثبت شده باشد.");
                return;
            }

            const labels = points.map(p => p.exam_name);
            const note = points.length === 1
                ? `<div class="meta" style="margin-bottom:10px">با ثبت آزمون‌های بعدی، روند نمودارها نمایش داده می‌شود.</div>`
                : "";

            view.innerHTML = `
    ${note}
    <div class="card"><div class="card-title">روند تراز کل</div><div class="chart-box"><canvas id="p-traz"></canvas></div></div>
    <div class="card"><div class="card-title">روند رتبه کل <small>هرچه بالاتر، بهتر</small></div><div class="chart-box"><canvas id="p-rank"></canvas></div></div>
    <div class="card"><div class="card-title">رتبه هر درس <small>هرچه بالاتر، بهتر</small></div><div class="chart-box"><canvas id="p-subj-rank"></canvas></div></div>
    <div class="card"><div class="card-title">تعداد پاسخ صحیح هر درس</div><div class="chart-box"><canvas id="p-subj-correct"></canvas></div></div>
    <div class="card"><div class="card-title">دلایل پاسخ‌ها در هر آزمون <small>تعداد موارد ثبت‌شده</small></div><div class="chart-box" style="height:280px"><canvas id="p-reasons"></canvas></div></div>`;

            lineChart("p-traz", labels, [singleLine("تراز کل", "#4f46e5", points.map(p => p.overall_traz))]);
            lineChart("p-rank", labels, [singleLine("رتبه کل", "#7c3aed", points.map(p => p.overall_rank))], true);

            lineChart("p-subj-rank", labels, SUBJECT_ORDER.map(code =>
                singleLine(SUBJECT_NAME[code], SUBJECT_COLOR[code], points.map(p => (p.subjects[code] ? p.subjects[code].rank : null)))
            ), true);

            lineChart("p-subj-correct", labels, SUBJECT_ORDER.map(code =>
                singleLine(SUBJECT_NAME[code], SUBJECT_COLOR[code], points.map(p => (p.subjects[code] ? p.subjects[code].correct : null)))
            ));

            stackedBars("p-reasons", reasons.map(r => r.exam_name), Object.entries(REASONS).map(([code, info]) => ({
                label: info.label,
                data: reasons.map(r => r.counts[code] || 0),
                backgroundColor: info.color,
            })));
        }

        // ---------- Actions ----------

        document.addEventListener("click", async e => {
            // Redeem invite code
            if (e.target.closest("#redeem-btn")) {
                const btn = e.target.closest("#redeem-btn");
                const code = $("#invite-input").value.trim();
                if (!code) {
                    notify("کد دعوت را وارد کنید.", "err");
                    return;
                }
                btn.disabled = true;
                try {
                    const advisor = await api("/me/advisor/redeem", {
                        method: "POST",
                        body: JSON.stringify({ code }),
                    });
                    notify(`با موفقیت به ${advisor.full_name} متصل شدید.`, "ok");
                    await renderDashboard();
                } catch (err) {
                    notify(err.message, "err");
                    btn.disabled = false;
                }
                return;
            }

            // Unlink advisor
            if (e.target.closest("#unlink-btn")) {
                const ok = await confirmDialog(
                    "قطع اتصال با مشاور",
                    "پس از قطع اتصال، مشاور دیگر آزمون‌های شما را نمی‌بیند. آزمون‌های شما حذف نمی‌شوند."
                );
                if (!ok) return;
                try {
                    await api("/me/advisor", { method: "DELETE" });
                    notify("اتصال با مشاور قطع شد.", "ok");
                    await renderDashboard();
                } catch (err) {
                    notify(err.message, "err");
                }
                return;
            }

            // Delete exam
            const del = e.target.closest("#delete-exam");
            if (del) {
                const ok = await confirmDialog(
                    "حذف آزمون",
                    `آزمون «${del.dataset.name}» حذف شود؟ این کار قابل بازگشت نیست.`
                );
                if (!ok) return;
                try {
                    await api(`/exams/${encodeURIComponent(del.dataset.id)}`, { method: "DELETE" });
                    location.hash = "#/exams";
                } catch (err) {
                    notify(err.message, "err");
                }
            }
        });

        // ---------- Router ----------

        function currentRoute() {
            const parts = location.hash.replace(/^#\/?/, "").split("/").filter(Boolean);
            if (parts[0] === "exams" && parts[1]) return { name: "exam", id: parts[1] };
            if (parts[0] === "exams") return { name: "exams" };
            if (parts[0] === "progress") return { name: "progress" };
            return { name: "dashboard" };
        }

        async function render() {
            resetCharts();
            const route = currentRoute();
            const navKey = route.name === "exam" ? "exams" : route.name;
            document.querySelectorAll("nav.bottom a").forEach(a => {
                a.classList.toggle("active", a.dataset.nav === navKey);
            });

            $("#notice").innerHTML = "";
            $("#view").innerHTML = `<div class="loader"><div class="spinner"></div></div>`;
            window.scrollTo({ top: 0 });

            if (!registered) {
                $("#view").innerHTML = `
      <div class="card empty">
        <div class="icon">📝</div>
        <div><b>هنوز ثبت‌نام نکرده‌اید</b></div>
        <div style="margin:6px 0 14px">برای ثبت آزمون‌ها ابتدا نام خود را وارد کنید.</div>
        <a class="cta" href="${formLink()}" style="margin:0">ثبت‌نام و ثبت آزمون</a>
      </div>`;
                return;
            }

            try {
                if (route.name === "exam") await renderExam(route.id);
                else if (route.name === "exams") await renderExams();
                else if (route.name === "progress") await renderProgress();
                else await renderDashboard();
            } catch (err) {
                $("#view").innerHTML = `<div class="card error">${esc(err.message)}</div>`;
            }
        }

        window.addEventListener("hashchange", render);

        (async () => {
            await loadHero();
            await render();
        })();
    </script>
</body>

</html>
